<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>表示 | STUDIO CUE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ccircle%20cx='50'%20cy='50'%20r='44'%20fill='%23ff4d8d'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='17'%20fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/display.css">
</head>
<body class="studio">
<header class="studio-top">
  <span class="logo">◉ STUDIO CUE</span>
  <div id="onair" class="onair">ON AIR</div>
  <span id="roomBadge" class="pill">ROOM ----</span>
  <span id="conn" class="pill">未接続</span>
  <span class="sp"></span>
  <span id="dateLine" class="mono" style="font-size:13px"></span>
  <span id="clock" class="clock mono">--:--:--</span>
  <button id="soundBtn" class="icon-btn">🔔 音ON</button>
  <button id="fsBtn" class="icon-btn">⛶ 全画面</button>
</header>

<main id="stage" class="stage">
  <section id="panel" class="main-panel hide-when-prompt" data-status="normal">
    <div class="ev-label">NOW ON CUE</div>
    <div id="evTitle" class="ev-title">待機中...</div>
    <div id="count" class="count">--:--:--</div>
    <div id="nextCue" class="next-cue" style="display:none">
      <span class="nc-label">NEXT CUE</span>
      <span id="nextTitle"></span>
      <span id="nextTime" class="mono"></span>
    </div>
    <div class="bars">
      <div class="bar-row"><span id="secLabel">区間</span><div class="bar"><i id="secBar"></i></div><span id="secPct" class="mono">-%</span></div>
      <div class="bar-row"><span>全体</span><div class="bar"><i id="totBar"></i></div><span id="totPct" class="mono">-%</span></div>
    </div>
  </section>

  <div id="ticker" class="ticker" aria-live="polite"></div>
  <div id="cueMeta" class="cue-meta" aria-live="polite"></div>

  <section class="card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <strong>番組進行表</strong><span class="sp" style="flex:1"></span><span id="runMeta" class="muted" style="font-size:12px"></span>
    </div>
    <ol id="rundown" class="rundown"></ol>
  </section>
  <div class="stage-foot">◉ STUDIO CUE v9.2 · CUE・進行表は自動更新</div>
</main>

<main id="enter" class="wrap">
  <div class="card enter">
    <h1 style="margin:0 0 8px">◉ STUDIO CUE <span class="muted" style="font-size:15px">表示側</span></h1>
    <p class="muted">送信側から共有されたルームIDを入力してください。</p>
    <div style="display:flex;gap:8px">
      <input id="joinId" inputmode="numeric" placeholder="例: 123456" maxlength="6">
      <button id="joinBtn">表示開始</button>
    </div>
    <p class="muted" style="font-size:12px"><a href="index.html">← ホームに戻る</a></p>
  </div>
  <div class="footer">◉ STUDIO CUE</div>
</main>

<script type="module" src="assets/js/display.js"></script>
</body>
</html>
